<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body,html{
    margin: 0;
}
#div {
    border: 10px solid black;
    background-image: url(bgGradient.jpg);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-position: center;
    padding: 0;
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;      
    box-sizing: border-box;
    height: 100vh;
}
#div h1 {
    margin: 20px 0;
    color: rgb(216, 154, 252);
}
#div p {
    font-size: 50px;
    color: white;
    margin: 20px 0;
}
#div button {
    margin: 5px;
    padding: 10px 20px;
    background-color: violet;
    border: 1px solid crimson;
    border-radius: 50px;
}
    </style>
</head>
<body>
    <div id="div">
        <h1 id="ten">10</h1>
        <div id="btns">
        <button id="Start">Start</button>
        <button id="Stop">Stop</button>
        <button id="Reset">Reset</button>
        </div>
    </div>

    <script>
        let countdown = document.getElementById('ten');
        let strt = document.getElementById('Start');
        let stp = document.getElementById('Stop');
        let rst = document.getElementById('Reset');
        let count = 10 ;
        let interval ;

        function startcount(){
            count --;
            if(count>0){
                countdown.innerHTML = count
            }
            else{
                clearInterval(interval)
                countdown.innerHTML = '0'
            };
        };
        strt.addEventListener('click',function(){
            if(count>0){
                clearInterval(interval)
                interval = setInterval(startcount,1000)
            }
            else{
                count = 10
                countdown.innerHTML = '10'
                clearInterval(interval)
                interval = setInterval(startcount,1000)
            }
        });

        stp.addEventListener('click',function(){
            clearInterval(interval)
        });

        rst.addEventListener('click',function(){
            clearInterval(interval)
            count=10;
            countdown.innerHTML = '10';
        });

    </script>

</body>
</html>
